services:
  postgres:
    image: postgres:16-alpine
    container_name: district13-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-district13}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-district13}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - district13-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: district13-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-district13}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-district-13-jwt-access-secret-32-chars-long-minimum}
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 604800
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - district13-network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: district13-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      BACKEND_URL: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - district13-network

volumes:
  pgdata:
    driver: local

networks:
  district13-network:
    driver: bridge
