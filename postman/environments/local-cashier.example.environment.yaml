name: District 13 Local Cashier Example
values:
  - key: base_url
    value: 'http://localhost:3000'
    enabled: true
    type: default
    description: Local NestJS API URL.
  - key: cashier_username
    value: cashier
    enabled: true
    type: default
    description: Username of an active local cashier account.
  - key: cashier_password
    value: ''
    enabled: true
    type: secret
    description: Set in a private local environment file; do not commit a real password.
