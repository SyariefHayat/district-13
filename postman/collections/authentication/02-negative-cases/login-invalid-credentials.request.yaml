$kind: http-request
name: Login with invalid credentials
method: POST
url: '{{base_url}}/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "deliberately-invalid-password"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('invalid credentials receive the generic authentication error', function () {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().message).to.eql('Invalid username or password');
      });
