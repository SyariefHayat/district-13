$kind: http-request
name: Inventory movements history
method: GET
url: '{{base_url}}/inventory/movements'
order: 5400
headers:
  - key: Authorization
    value: 'Bearer {{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('movements history returns 200', function () {
        pm.response.to.have.status(200);
      });
      const body = pm.response.json();
      pm.test('movements is an array', function () {
        pm.expect(body.data).to.be.an('array');
      });
