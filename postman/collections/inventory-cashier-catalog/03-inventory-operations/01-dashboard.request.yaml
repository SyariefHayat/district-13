$kind: http-request
name: Inventory dashboard
method: GET
url: '{{base_url}}/inventory/dashboard'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('inventory dashboard returns 200', function () {
        pm.response.to.have.status(200);
      });
      const body = pm.response.json();
      pm.test('dashboard has data array and summary metrics', function () {
        pm.expect(body.data).to.be.an('array');
        pm.expect(body.summary).to.be.an('object');
        pm.expect(body.summary.lowStockCount).to.be.a('number');
        pm.expect(body.summary.needsReviewCount).to.be.a('number');
      });
