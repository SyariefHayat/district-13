$kind: http-request
name: CASHIER cannot list audit logs
method: GET
url: '{{base_url}}/audit-logs?page=1&limit=20'
order: 11000
headers:
  - key: Authorization
    value: 'Bearer {{cashier_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('CASHIER audit listing is forbidden', function () { pm.response.to.have.status(403); });
