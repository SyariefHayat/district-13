$kind: http-request
name: ADMIN shift report
method: GET
url: '{{base_url}}/reports/shifts?startDate=2026-01-01&endDate=2026-12-31&page=1&limit=20'
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('shift report only finalizes closed shifts', function () {
        pm.response.to.have.status(200);
        const b = pm.response.json();
        pm.expect(b.data).to.be.an('array');
        pm.expect(b.page).to.eql(1);
        b.data.forEach((s) => {
          if (!s.closedAt) {
            pm.expect(s.closingCash).to.eql(null);
            pm.expect(s.cashDifference).to.eql(null);
          }
        });
      });
