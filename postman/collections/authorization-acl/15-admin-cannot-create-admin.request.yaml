$kind: http-request
name: Admin cannot create admin
method: POST
url: '{{base_url}}/users'
order: 15000
headers:
  - key: Authorization
    value: 'Bearer {{admin_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{"username":"admin_attempt","password":"password123","role":"ADMIN"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('ADMIN cannot create ADMIN (403 Forbidden)', function () {
        pm.response.to.have.status(403);
      });
