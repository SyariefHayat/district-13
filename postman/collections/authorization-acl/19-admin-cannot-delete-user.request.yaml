$kind: http-request
name: Admin cannot delete user
method: DELETE
url: '{{base_url}}/users/{{target_user_id}}'
order: 19000
headers:
  - key: Authorization
    value: 'Bearer {{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('ADMIN cannot delete users (403 Forbidden)', function () {
        pm.response.to.have.status(403);
      });
