$kind: http-request
name: Owner can update settings
method: PATCH
url: '{{base_url}}/settings'
order: 21000
headers:
  - key: Authorization
    value: 'Bearer {{owner_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{"storeName":"District 13 Updated","taxMode":"none","taxRate":0}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('OWNER can update store settings', function () {
        pm.response.to.have.status(200);
      });
