$kind: http-request
name: Owner cannot open shift
method: POST
url: '{{base_url}}/shifts/open'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{owner_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "openingCash": "0.00"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('OWNER cannot open a shift', function () {
        pm.response.to.have.status(403);
      });
