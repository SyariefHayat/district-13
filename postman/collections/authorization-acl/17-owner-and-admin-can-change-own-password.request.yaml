$kind: http-request
name: Admin can change own password
method: POST
url: '{{base_url}}/users/me/password'
order: 17000
headers:
  - key: Authorization
    value: 'Bearer {{admin_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{"currentPassword":"password123","newPassword":"newPassword456"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('ADMIN can change own password', function () {
        pm.expect([200, 201]).to.include(pm.response.code);
      });
