$kind: http-request
name: Admin cannot restock inventory
method: POST
url: '{{base_url}}/inventory/restocks'
order: 32000
headers:
  - key: Authorization
    value: 'Bearer {{admin_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{"productId":"00000000-0000-0000-0000-000000000001","quantity":10}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('ADMIN cannot restock inventory (Pemilik only)', function () {
        pm.response.to.have.status(403);
      });
