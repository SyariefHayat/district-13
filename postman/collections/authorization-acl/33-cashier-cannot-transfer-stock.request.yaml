$kind: http-request
name: Cashier cannot transfer inventory
method: POST
url: '{{base_url}}/inventory/transfers'
order: 33000
headers:
  - key: Authorization
    value: 'Bearer {{cashier_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{"productId":"00000000-0000-0000-0000-000000000001","quantity":5}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('CASHIER cannot transfer inventory', function () {
        pm.response.to.have.status(403);
      });
