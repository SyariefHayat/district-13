$kind: http-request
name: Owner can reset queue counter
method: POST
url: '{{base_url}}/settings/queue-counter/reset'
order: 23000
headers:
  - key: Authorization
    value: 'Bearer {{owner_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('OWNER can reset queue counter', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
