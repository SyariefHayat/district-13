$kind: http-request
name: Cashier cannot change own password
method: POST
url: '{{base_url}}/users/me/password'
order: 18000
headers:
  - key: Authorization
    value: 'Bearer {{cashier_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{"currentPassword":"password123","newPassword":"newPassword456"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('CASHIER cannot change own password (403 Forbidden)', function () {
        pm.response.to.have.status(403);
      });
