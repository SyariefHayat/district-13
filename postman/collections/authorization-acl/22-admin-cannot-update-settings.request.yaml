$kind: http-request
name: Admin cannot update settings
method: PATCH
url: '{{base_url}}/settings'
order: 22000
headers:
  - key: Authorization
    value: 'Bearer {{admin_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{"storeName":"District 13 Unauthorized"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('ADMIN cannot update store settings (403 Forbidden)', function () {
        pm.response.to.have.status(403);
      });
