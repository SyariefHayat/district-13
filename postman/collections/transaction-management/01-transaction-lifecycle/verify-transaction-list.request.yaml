$kind: http-request
name: Verify transaction appears in paginated list
method: GET
url: "{{base_url}}/transactions?page=1&limit=100&transactionNumber={{transaction_number}}"
order: 17000
headers:
  - key: Authorization
    value: "Bearer {{cashier_token}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('cashier can list own transactions with pagination', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.page).to.eql(1);
        pm.expect(body.limit).to.eql(100);
        pm.expect(body.total).to.be.at.least(1);
        pm.expect(body.data).to.have.length(1);
        pm.expect(body.data[0].id).to.eql(pm.collectionVariables.get('transaction_id'));
        pm.expect(body.data[0].status).to.eql('VOIDED');
      });
