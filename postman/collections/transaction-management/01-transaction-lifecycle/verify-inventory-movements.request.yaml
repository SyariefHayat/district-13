$kind: http-request
name: Verify sale and void inventory movements
method: GET
url: "{{base_url}}/inventory/movements?productId={{product_id}}&page=1&limit=100"
order: 19000
headers:
  - key: Authorization
    value: "Bearer {{owner_token}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('OWNER can audit inventory movements for the transaction', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        const movements = body.data.filter(function (movement) {
          return movement.transactionId === pm.collectionVariables.get('transaction_id');
        });
        pm.expect(movements.some(function (movement) {
          return movement.type === 'SALE' && movement.quantity === 1;
        })).to.eql(true);
        pm.expect(movements.some(function (movement) {
          return movement.type === 'VOID_RETURN' && movement.quantity === 1;
        })).to.eql(true);
      });
