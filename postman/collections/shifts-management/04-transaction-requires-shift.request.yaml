$kind: http-request
name: Transaction requires an active shift
method: POST
url: '{{base_url}}/transactions'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{cashier_token}}'
  - key: Content-Type
    value: application/json
  - key: Idempotency-Key
    value: a90892be-7fb9-4333-ab02-8e7a11b4b67d
body:
  type: json
  content: |-
    {
      "items": [
        {
          "productId": "00000000-0000-4000-8000-000000000000",
          "quantity": 1,
          "addonIds": []
        }
      ],
      "paymentMethod": "CASH",
      "paidAmount": "0.00"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('sale is rejected before a shift is opened', function () {
        pm.response.to.have.status(409);
        pm.expect(pm.response.text()).to.include('Open a shift before creating a transaction');
      });
