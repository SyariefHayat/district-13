$kind: http-request
name: Create completed cash sale
method: POST
url: '{{base_url}}/transactions'
order: 8000
headers:
  - key: Authorization
    value: 'Bearer {{cashier_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "paymentMethod": "CASH",
      "totalAmount": "1000.00"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('cash sale is associated with the active shift', function () {
        pm.response.to.have.status(201);
        const body = pm.response.json();
        pm.expect(body.shiftId).to.eql(pm.collectionVariables.get('shift_id'));
        pm.expect(body.status).to.eql('COMPLETED');
        pm.expect(body.totalAmount).to.eql('1000.00');
      });
