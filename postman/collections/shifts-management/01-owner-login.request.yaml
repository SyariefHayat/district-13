$kind: http-request
name: Owner login
method: POST
url: '{{base_url}}/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "{{owner_username}}",
      "password": "{{owner_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('owner login succeeds', function () {
        pm.response.to.have.status(200);
      });
      const body = pm.response.json();
      pm.test('login returns an access token', function () {
        pm.expect(body.accessToken).to.be.a('string').and.not.empty;
      });
      pm.collectionVariables.set('owner_token', body.accessToken);
