$kind: http-request
name: Get current shift
method: GET
url: '{{base_url}}/shifts/current'
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{cashier_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('cashier can read the current shift', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get('shift_id'));
      });
