$kind: http-request
name: Record cash OUT
method: POST
url: '{{base_url}}/shifts/{{shift_id}}/cash-movements'
order: 11000
headers:
  - key: Authorization
    value: 'Bearer {{cashier_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "type": "OUT",
      "amount": "200.00",
      "description": "Postman shift test cash out"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('cashier records a positive cash OUT on own shift', function () {
        pm.response.to.have.status(201);
        const body = pm.response.json();
        pm.expect(body.shiftId).to.eql(pm.collectionVariables.get('shift_id'));
        pm.expect(body.type).to.eql('OUT');
        pm.expect(body.amount).to.eql('200.00');
      });
