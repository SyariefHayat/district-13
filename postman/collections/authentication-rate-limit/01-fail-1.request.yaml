$kind: http-request
name: Failed login 1 of 5
method: POST
url: '{{base_url}}/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "username": "{{username}}", "password": "{{wrong_password}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('failed attempt 1 is unauthorized or already rate limited', function () {
        pm.expect([401, 429]).to.include(pm.response.code);
      });
