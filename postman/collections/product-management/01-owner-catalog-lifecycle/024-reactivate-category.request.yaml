$kind: http-request
name: "Reactivate category"
method: PATCH
url: '{{base_url}}/categories/{{category_id}}'
order: 24000
headers:
  - key: Authorization
    value: 'Bearer {{owner_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "isActive": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('category can be reactivated', function () { pm.response.to.have.status(200); });
      pm.test('category is active again', function () { pm.expect(pm.response.json().isActive).to.eql(true); });
