$kind: http-request
name: "Owner login"
method: POST
url: '{{base_url}}/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const runId = Date.now().toString() + '-' + Math.floor(Math.random() * 1000000).toString();
      pm.variables.set('run_id', runId);
      pm.test('owner login succeeds', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test('login returns an access token', function () { pm.expect(body.accessToken).to.be.a('string').and.not.empty; });
      pm.variables.set('owner_token', body.accessToken);
