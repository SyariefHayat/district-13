$kind: http-request
name: "Update product price via dedicated endpoint"
method: PATCH
url: '{{base_url}}/products/{{product_id}}/price'
order: 29000
headers:
  - key: Authorization
    value: 'Bearer {{owner_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "price": "22500.00"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('owner can update product price via dedicated endpoint', function () { pm.response.to.have.status(200); });
      pm.test('updated price matches request', function () { pm.expect(pm.response.json().price).to.eql('22500.00'); });
