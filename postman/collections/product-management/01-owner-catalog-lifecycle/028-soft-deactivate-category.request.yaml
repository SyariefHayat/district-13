$kind: http-request
name: "Soft-deactivate category at end of run"
method: DELETE
url: '{{base_url}}/categories/{{category_id}}'
order: 28000
headers:
  - key: Authorization
    value: 'Bearer {{owner_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('category can be deactivated after its product is inactive', function () { pm.response.to.have.status(200); });
      pm.test('category is now inactive', function () { pm.expect(pm.response.json().isActive).to.eql(false); });
