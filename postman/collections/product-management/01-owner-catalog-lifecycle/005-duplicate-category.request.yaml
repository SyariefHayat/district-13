$kind: http-request
name: "Reject normalized duplicate category"
method: POST
url: '{{base_url}}/categories'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{owner_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "pm {{run_id}} category"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('case-insensitive duplicate category is rejected with 409', function () { pm.response.to.have.status(409); });
