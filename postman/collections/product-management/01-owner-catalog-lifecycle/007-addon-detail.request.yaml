$kind: http-request
name: "Read add-on detail"
method: GET
url: '{{base_url}}/addons/{{addon_id}}'
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{owner_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('add-on detail is available', function () { pm.response.to.have.status(200); });
      pm.test('detail returns the created add-on', function () { pm.expect(pm.response.json().id).to.eql(pm.variables.get('addon_id')); });
