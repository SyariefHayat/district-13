$kind: http-request
name: "Update add-on price via dedicated endpoint"
method: PATCH
url: '{{base_url}}/addons/{{addon_id}}/price'
order: 30000
headers:
  - key: Authorization
    value: 'Bearer {{owner_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "price": "3500.00"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('owner can update addon price via dedicated endpoint', function () { pm.response.to.have.status(200); });
      pm.test('updated addon price matches request', function () { pm.expect(pm.response.json().price).to.eql('3500.00'); });
