name: Security Hardening & OWASP ZAP Baseline Scan (T-65)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Security Hardening (TLS, Headers, Log Sanitization)
        run: |
          chmod +x ./scripts/security/verify-security.sh
          ./scripts/security/verify-security.sh

      - name: NPM Dependency Vulnerability Audit
        run: |
          cd backend && npm audit --audit-level=critical || true

  zap-baseline-scan:
    name: OWASP ZAP Baseline Dynamic Security Scan
    runs-on: ubuntu-latest
    needs: security-audit
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start Target Service for ZAP Scan
        run: |
          node ./scripts/security/zap-target-server.mjs &
          npx wait-on http://localhost:3000/health --timeout 15000

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:3000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: false
